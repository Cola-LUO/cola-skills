name: Release

# 触发：推送 v* tag（如 v1.2.0）。tag 内容必须已在 CI 通过。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Test & create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: SKILL/cola-invest-skill/bin/requirements.txt

      # 发布前在干净的 CI 环境复跑一遍完整校验，
      # 防止绕过 PR 直接推 tag 时带上坏代码
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r SKILL/cola-invest-skill/bin/requirements.txt
          pip install pytest ruff==0.16.6

      - name: ruff check
        run: ruff check .

      - name: Run tests
        run: python -m pytest SKILL/cola-invest-skill/tests/ -v

      # 用 gh CLI 建 Release（不引入第三方 action）：
      # --generate-notes 自动汇总自上个 tag 以来的 commit / PR
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "cola-invest-skill $GITHUB_REF_NAME" \
            --generate-notes
