name: CI

# 触发：PR（任意分支）+ 直接 push 到 main
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: ruff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff==0.16.6

      - name: ruff check
        run: ruff check .

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: SKILL/cola-invest-skill/bin/requirements.txt

      # pymupdf / lxml 在 linux 均有预编译 wheel，安装零编译
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r SKILL/cola-invest-skill/bin/requirements.txt
          pip install pytest

      # 测试全部离线：不向 SEC / 披露易 / 巨潮发起任何网络请求
      - name: Run tests
        run: python -m pytest SKILL/cola-invest-skill/tests/ -v
